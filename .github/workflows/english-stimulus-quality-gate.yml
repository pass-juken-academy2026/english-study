name: English Common Test stimulus quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stimulus-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Audit live English Common Test passage lengths, tables, options, answers and explanations
        run: node tests/english-common-stimulus-content.test.cjs
      - name: Run regression tests for the standalone quality checker
        run: node tests/audit-common-test-stimuli.test.cjs
